name: keep-alive

# Pings the live demo every ~10 minutes so the free Render instance never
# sleeps. Runs on GitHub's cloud; works even when my laptop is off.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the demo
        run: |
          URL="https://reliefgrid.onrender.com/api/health"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 80 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "ping did not get 200 (instance may be cold-starting); not failing the job"
